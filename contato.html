        <main class="container">
            <h1> Cadastro para dicas de viagens</h1>
            <p>Preencha seus dados</p>

            <div class="area-inscricao"> 

                <form action="/processar-cadastro" method="post" class="coluna-form">
                    
                    <label for="nome">Nome Completo:</label>
                    <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required minlength="11" maxlength="11"><br>

                    <label for="senha">CPF:</label>
                    <input type="password" id="senha" name="senha" placeholder="Digite seu CPF" required minlength="8" maxlength="15"><br>

                    <label for="email">E-mail:</label>
                    <input type="email" id="email" name="email" placeholder="exemplo@dominio.com" required><br>
                    
                    <label for="data_nasc">Data de nascimento:</label>
                    <input type="date" id="data_nasc" name="data_nascimento" min="1900-01-01" max="2026-12-31" required><br>

                    <button type="submit" class="btn-enviar">Enviar</button>
                    
                </form>

            </div>

        </main>
            


</body>
</html>
